<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CloudFiles</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: Arial, Helvetica, sans-serif;
        }

        #game {
            width: 100vw;
            height: 100vh;
            border: 0;
            display: none;
            background: #000;
        }

        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 14px;
            color: white;
            background: #0d0d0d;
        }

        .spinner {
            width: 38px;
            height: 38px;
            border: 4px solid #333;
            border-top-color: white;
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #error {
            display: none;
            color: #aaa;
            text-align: center;
        }

        #error strong {
            display: block;
            color: white;
            font-size: 20px;
            margin-bottom: 8px;
        }
    </style>
</head>

<body>

<div id="loading">
    <div class="spinner"></div>
    <div>Loading...</div>
</div>

<div id="error">
    <strong>File not found</strong>
    This CloudFiles link is invalid or has expired.
</div>

<iframe id="game"></iframe>

<script>
(async () => {
    const path = window.location.pathname;

    const match =
        path.match(/^\/CloudFiles\/([A-Za-z0-9]+)\/?$/);

    if (!match) {
        document.getElementById("loading").style.display = "none";
        document.getElementById("error").style.display = "block";
        return;
    }

    const randomPath = match[1];

    const storageKey =
        "cloudfiles_redirect_" + randomPath;

    const destination =
        sessionStorage.getItem(storageKey);

    if (!destination) {
        document.getElementById("loading").style.display = "none";
        document.getElementById("error").style.display = "block";
        return;
    }

    const iframe = document.getElementById("game");

    iframe.src =
        "/CloudFiles/" + destination;

    iframe.onload = () => {
        document.getElementById("loading").style.display = "none";
        iframe.style.display = "block";
    };
})();
</script>

</body>
</html>
